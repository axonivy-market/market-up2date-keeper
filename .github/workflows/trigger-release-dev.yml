name: Trigger Release-Build-Dev
run-name: Release-Build-Dev for ${{ inputs.product || 'all market products' }} ${{ inputs.branches }}

on:
  schedule:
    - cron: '0 22 * * 0-5'
    - cron: &weekly '0 22 * * 6'
  workflow_dispatch:
    inputs:
      product:
        description: 'GitHub repository name (e.g. alfresco-connector) or blank for all products of the axonivy-market org'
        required: false
        default: ''
      branches:
        description: 'Release branches, space separated (e.g. "master dev/14.0"), "all" for every release branch or blank for the daily branches'
        required: false
        default: ''
      dryRun:
        description: 'Build the products without deploying their snapshots'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dispatch:
    uses: ./.github/workflows/dispatch-workflow.yml
    secrets: inherit
    with:
      workflow: release-dev.yml
      dailyBranches: 'master dev/14.0'
      weeklyCron: *weekly
      weeklyBranches: all
      product: ${{ inputs.product }}
      branches: ${{ inputs.branches }}
      workflowInputs: dryRun=${{ github.event_name == 'schedule' && 'false' || inputs.dryRun }}
      extraIgnoredRepoList: release_dev_ignored_repos
