name: Latest status report
on: 
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to inspect for project files
        required: false
        default: dev/14.0
  schedule:
    - cron:  '01 00 * * *'

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  build:
    name: Checking status for market products
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Write JSON
      run: |
        mkdir -p target/page
        ./latestRelease.sh "${{ inputs.branch }}" | tee target/page/market.json
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Write CSV
      run: source ./latestRelease.sh && latestReposCSV target/page/market.json > target/page/market.csv
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: target/page

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
